[project]
name = "hacktoberfest-tracker"
version = "0.1.0"
description = "MLH Hacktoberfest 2026 Event Tracker & Schedule TUI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.0",
    "requests>=2.32.0",
    "rich>=14.0.0",
]

[project.scripts]
hacktrack = "tui:main"
scraper = "scraper:main"
